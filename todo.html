<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU CAN DO IT</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1E1E1E; /* Figma Dark Background */
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Cut hone se bachane ke liye top se shuru kiya */
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto; /* Agar screen chhoti ho toh poora page scroll ho sake */
        }

        .dashboard-container {
            width: 100%;
            max-width: 950px;
            background-color: #121212;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-circle {
            width: 55px;
            height: 55px;
            background-color: #E0E0E0;
            border-radius: 50%;
            overflow: hidden; /* Image ko circle ke andar rakhne ke liye */
            border: 2px solid #00FFCC;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Image perfectly fit ho jaye */
        }

        .username {
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .user-level {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffcc00; /* Default color, JS se change hoga */
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 3px;
        }

        .gold-counter {
            background-color: #FFB300;
            color: black;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .add-quest-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quest-input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #2B2D31;
            background-color: #1A1C1E;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .add-quest-btn {
            background-color: #00FFCC;
            color: black;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Responsive Columns Grid */
        .quests-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Responsive columns for mobile screens */
        @media (max-width: 600px) {
            .quests-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .quest-box {
            border: 2px solid #2B2D31;
            background-color: #1A1C1E;
            border-radius: 10px;
            height: 320px; /* Fixed Box height */
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .box-title {
            color: #00FFCC;
            text-align: center;
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        /* Dynamic List Wrapper Inside Box */
        .list-container {
            flex: 1;
            overflow-y: auto; /* Content zyaada hone par internal scrollbar banega */
            padding-right: 5px;
        }

        /* Cool Dark Scrollbar */
        .list-container::-webkit-scrollbar {
            width: 5px;
        }
        .list-container::-webkit-scrollbar-thumb {
            background: #3A3D42;
            border-radius: 4px;
        }

        .quest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background-color: #22252A;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid #00FFCC;
            font-size: 0.9rem;
            word-break: break-all; /* Fixed massive strings breakage */
        }

        .quest-item span {
            flex: 1;
        }

        .check-btn {
            background-color: #00FFCC;
            border: none;
            color: black;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .delete-btn {
            background-color: #FF3B30;
            border: none;
            color: white;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        #timerDisplay {
            font-size: 2.8rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            color: #00FFCC;
            display: none;
        }

        .focus-button {
            width: 100%;
            background-color: #FF3B30;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .focus-button:hover {
            background-color: #E03026;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <div class="profile-info">
                <div class="avatar-circle">
                    <img id="profilePic" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTEmjJ-PLKxKk7Q3yDqVnw-DK31ZjRGrYbfQw&s" alt="Profile Picture">
                </div>
                <div>
                    <h2 class="username">VIHAAN</h2>
                    <p class="user-level" id="userLevelDisplay">LVL 1 RECRUIT</p>
                </div>
            </div>
            <div class="gold-counter">0 GOLD 🪙</div>
        </div>

        <div class="add-quest-section">
            <input type="text" id="questInput" class="quest-input" placeholder="Enter new quest name...">
            <button id="addQuestBtn" class="add-quest-btn">ADD QUEST</button>
        </div>

        <div class="quests-wrapper">
            <div class="quest-box">
                <h3 class="box-title">COMPLETED</h3>
                <div id="completedList" class="list-container"></div>
            </div>
            <div class="quest-box">
                <h3 class="box-title">MAIN QUESTS</h3>
                <div id="mainQuestsList" class="list-container"></div>
            </div>
        </div>

        <div id="timerDisplay">25:00</div>

        <button id="startFocusBtn" class="focus-button">START FOCUS</button>
    </div>

    <script>
        const startBtn = document.getElementById('startFocusBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const goldDisplay = document.querySelector('.gold-counter');
        const levelDisplay = document.getElementById('userLevelDisplay');
        const mainQuestsList = document.getElementById('mainQuestsList');
        const completedList = document.getElementById('completedList');
        const questInput = document.getElementById('questInput');
        const addQuestBtn = document.getElementById('addQuestBtn');

        let currentGold = parseInt(localStorage.getItem('warriorGold')) || 0;
        let worker;
        let totalSeconds = 25 * 60; 
        let isTimerRunning = false;

        const levelsConfig = [
            { name: "RECRUIT", req: 0, color: "#AAAAAA" },       
            { name: "NOVICE", req: 1000, color: "#00FF66" },     
            { name: "APPRENTICE", req: 3000, color: "#00BCFF" }, 
            { name: "SQUIRE", req: 6000, color: "#9D5CFF" },     
            { name: "JOURNEYMAN", req: 10000, color: "#FF5E00" },
            { name: "FIGHTER", req: 15000, color: "#FF3366" },   
            { name: "VETERAN", req: 21000, color: "#FFFF00" },   
            { name: "EXPERT", req: 28000, color: "#00FFFF" },    
            { name: "CHAMPION", req: 36000, color: "#FF00FF" },  
            { name: "WARRIOR", req: 45000, color: "#FFD700" }    
        ];

        function updateGoldAndLevel(amount) {
            currentGold += amount;
            if (currentGold < 0) currentGold = 0; 
            
            localStorage.setItem('warriorGold', currentGold);
            goldDisplay.innerText = `${currentGold} GOLD 🪙`;

            let activeLevelIndex = 0;
            for (let i = 0; i < levelsConfig.length; i++) {
                if (currentGold >= levelsConfig[i].req) {
                    activeLevelIndex = i;
                } else {
                    break;
                }
            }

            let currentLevelNum = activeLevelIndex + 1;
            let currentLevelName = levelsConfig[activeLevelIndex].name;
            let currentLevelColor = levelsConfig[activeLevelIndex].color;

            levelDisplay.innerText = `LVL ${currentLevelNum} ${currentLevelName}`;
            levelDisplay.style.color = currentLevelColor;
            document.querySelector('.avatar-circle').style.borderColor = currentLevelColor;
        }

        function saveQuestsToStorage() {
            const mainQuests = [];
            mainQuestsList.querySelectorAll('.quest-item span').forEach(span => {
                mainQuests.push(span.innerText.replace('⚔️ ', ''));
            });

            const completedQuests = [];
            completedList.querySelectorAll('.quest-item span').forEach(span => {
                completedQuests.push(span.innerText.replace('⚔️ ', ''));
            });

            localStorage.setItem('mainQuests', JSON.stringify(mainQuests));
            localStorage.setItem('completedQuests', JSON.stringify(completedQuests));
        }

        function createQuestElement(taskText, isAlreadyCompleted = false) {
            const questItem = document.createElement('div');
            questItem.className = 'quest-item';

            const textSpan = document.createElement('span');
            textSpan.innerText = `⚔️ ${taskText}`;
            questItem.appendChild(textSpan);

            if (!isAlreadyCompleted) {
                const checkBtn = document.createElement('button');
                checkBtn.className = 'check-btn';
                checkBtn.innerText = 'CHECK';

                checkBtn.addEventListener('click', () => {
                    questItem.remove(); 
                    updateGoldAndLevel(50); 
                    createQuestElement(taskText, true); 
                    saveQuestsToStorage();
                });
                questItem.appendChild(checkBtn);
                mainQuestsList.appendChild(questItem);
            } else {
                questItem.style.borderLeft = "4px solid #888";
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerText = '🗑️';
                
                deleteBtn.addEventListener('click', () => {
                    questItem.remove();
                    updateGoldAndLevel(-50); 
                    saveQuestsToStorage();
                });

                questItem.appendChild(deleteBtn);
                completedList.appendChild(questItem);
            }
        }

        addQuestBtn.addEventListener('click', () => {
            const text = questInput.value.trim();
            if (text !== "") {
                createQuestElement(text, false);
                questInput.value = ""; 
                saveQuestsToStorage(); 
            }
        });

        questInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addQuestBtn.click();
        });

        function loadSavedData() {
            updateGoldAndLevel(0);

            const savedMain = JSON.parse(localStorage.getItem('mainQuests'));
            const savedCompleted = JSON.parse(localStorage.getItem('completedQuests'));

            if (savedMain || savedCompleted) {
                if (savedMain) savedMain.forEach(task => createQuestElement(task, false));
                if (savedCompleted) savedCompleted.forEach(task => createQuestElement(task, true));
            } else {
                const sampleQuests = ["Code for 25 mins", "Review Figma Design", "Fix Dashboard UI"];
                sampleQuests.forEach(quest => createQuestElement(quest, false));
                saveQuestsToStorage();
            }
        }

        function resetBtnAndTimer() {
            if (worker) {
                worker.terminate();
                worker = null;
            }
            isTimerRunning = false;
            timerDisplay.style.display = "none";
            startBtn.innerText = "START FOCUS";
            startBtn.style.backgroundColor = "#FF3B30";
            totalSeconds = 25 * 60;
            timerDisplay.innerText = "25:00";
        }

        // --- INLINE WEB WORKER MECHANISM FOR BACKGROUND RUNNING ---
        function initWorker() {
            const workerCode = `
                let endTime;
                let timerId;

                self.onmessage = function(e) {
                    if (e.data.action === 'start') {
                        endTime = Date.now() + e.data.duration * 1000;
                        
                        timerId = setInterval(() => {
                            let remaining = Math.round((endTime - Date.now()) / 1000);
                            if (remaining <= 0) {
                                clearInterval(timerId);
                                self.postMessage({ status: 'complete' });
                            } else {
                                self.postMessage({ status: 'tick', remaining: remaining });
                            }
                        }, 250); // High frequency checking for extreme precision
                    } else if (e.data.action === 'stop') {
                        clearInterval(timerId);
                    }
                };
            `;
            
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            return new Worker(URL.createObjectURL(blob));
        }

        function toggleFocus() {
            if (isTimerRunning) {
                resetBtnAndTimer();
                alert("Timer stopped! No reward given. 🛑");
                return;
            }
            
            isTimerRunning = true;
            timerDisplay.style.display = "block";
            startBtn.innerText = "STOP FOCUS";
            startBtn.style.backgroundColor = "#B3261E";
            
            worker = initWorker();
            worker.postMessage({ action: 'start', duration: totalSeconds });
            
            worker.onmessage = function(e) {
                if (e.data.status === 'tick') {
                    let currentRem = e.data.remaining;
                    let displayMins = Math.floor(currentRem / 60);
                    let displaySecs = currentRem % 60;
                    
                    displayMins = displayMins < 10 ? "0" + displayMins : displayMins;
                    displaySecs = displaySecs < 10 ? "0" + displaySecs : displaySecs;
                    timerDisplay.innerText = `${displayMins}:${displaySecs}`;
                } else if (e.data.status === 'complete') {
                    updateGoldAndLevel(50);
                    alert("🎉 Focus Session Complete! You earned 50 GOLD 🪙");
                    resetBtnAndTimer();
                }
            };
        }

        startBtn.addEventListener('click', toggleFocus);
        loadSavedData();
    </script>
</body>
</html>
